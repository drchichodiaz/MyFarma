# Servicios de desarrollo local. La app Next.js corre fuera de Docker con `pnpm dev`.
# Puertos movidos (5433, 6380) para no chocar con un Postgres o Redis local.
name: myfarma

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: myfarma
      POSTGRES_PASSWORD: myfarma
      POSTGRES_DB: myfarma
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfarma -d myfarma"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bandeja de correo falsa para probar enlaces mágicos y alertas: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db-data:
  redis-data:
