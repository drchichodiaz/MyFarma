name: Deploy

# Cada push a main: verificaciones → imágenes en GHCR → deploy al droplet.
on:
  push:
    branches: [main]
    # Cambios solo de documentación o del prototipo no despliegan.
    paths-ignore: ["**.md", "prototype/**"]
  workflow_dispatch:

# Un deploy a la vez; si llega otro push, el nuevo espera al anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen de la app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/drchichodiaz/myfarma:${{ github.sha }}
            ghcr.io/drchichodiaz/myfarma:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Imagen de migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/drchichodiaz/myfarma-migrate:${{ github.sha }}
            ghcr.io/drchichodiaz/myfarma-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
      - name: Imagen del worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/drchichodiaz/myfarma-worker:${{ github.sha }}
            ghcr.io/drchichodiaz/myfarma-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Llave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copiar archivos de deploy
        run: scp -i ~/.ssh/deploy deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh deploy/restore.sh root@$HOST:/opt/myfarma/
      - name: Desplegar
        run: |
          ssh -i ~/.ssh/deploy root@$HOST "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null \
            && bash /opt/myfarma/deploy.sh ${{ github.sha }}; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
      - name: Verificar
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "https://myfarma.net/api/health"; then exit 0; fi
            sleep 3
          done
          echo "La app no responde después del deploy" && exit 1
