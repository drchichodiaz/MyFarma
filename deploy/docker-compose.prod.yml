# ══════════════════════════════════════════════════════════════════════
# MyFarma — producción en un droplet de 2 GB.
# Solo Caddy publica puertos (80/443). Postgres y Redis viven en la red interna.
# Variables en /opt/myfarma/.env (las genera deploy/bootstrap.sh).
# ══════════════════════════════════════════════════════════════════════
name: myfarma

# Logs con rotación: como máximo ~3 × 10 MB por servicio (unos días), no crecen para siempre.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en .env}
      ROBOTS_TAG: ${ROBOTS_TAG:-noindex, nofollow}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

  app:
    image: ghcr.io/drchichodiaz/myfarma:${TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql://myfarma:${POSTGRES_PASSWORD}@db:5432/myfarma?schema=public
      REDIS_URL: redis://redis:6379
      DB_POOL_MAX: "10"
    volumes:
      # state/backup.json lo escribe backup.sh; /api/health lo muestra.
      - ./state:/state:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m

  # Procesa las fotos de los reportes (quita EXIF/GPS, genera AVIF/WebP) desde la cola en Redis.
  worker:
    image: ghcr.io/drchichodiaz/myfarma-worker:${TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql://myfarma:${POSTGRES_PASSWORD}@db:5432/myfarma?schema=public
      REDIS_URL: redis://redis:6379
      DB_POOL_MAX: "2"
      APP_INTERNAL_URL: http://app:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 320m

  # Se ejecuta en cada deploy antes de levantar la app: migraciones + catálogo.
  migrate:
    image: ghcr.io/drchichodiaz/myfarma-migrate:${TAG:-latest}
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://myfarma:${POSTGRES_PASSWORD}@db:5432/myfarma?schema=public
      # Producción nunca carga datos de ejemplo y borra los que queden (gana sobre el .env).
      SEED_DEMO: "0"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: myfarma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: myfarma
    # Ajustado para ~2 GB de RAM compartidos con la app.
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c max_connections=40
        -c random_page_cost=1.1
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfarma -d myfarma"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 640m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # noeviction: BullMQ no tolera que Redis borre claves de la cola para hacer espacio.
    # Sin disco: si se reinicia, el worker re-encola las fotos pendientes desde Postgres.
    command:
      ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

volumes:
  db-data:
  caddy-data:
  caddy-config:
